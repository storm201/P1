version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: oss_discovery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: oss_discovery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oss_discovery"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oss_discovery_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/oss_discovery
      OPS_TOKEN: dev-ops-token-secret
      API_V1_PREFIX: /api/v1
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oss_discovery_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/oss_discovery
      OPS_TOKEN: dev-ops-token-secret
    command: ["python", "-m", "app.worker.worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oss_discovery_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
