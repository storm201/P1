version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: oss_discovery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-oss_discovery}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oss_discovery"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oss_discovery_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-change_me_in_production_db_password}@db:5432/oss_discovery}
      OPS_TOKEN: ${OPS_TOKEN:-replace_with_secure_random_operator_token}
      API_V1_PREFIX: /api/v1
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oss_discovery_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-change_me_in_production_db_password}@db:5432/oss_discovery}
      OPS_TOKEN: ${OPS_TOKEN:-replace_with_secure_random_operator_token}
    command: ["python", "-m", "app.worker.worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oss_discovery_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
